<meta name="robots" content="noindex">

<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0A0A0A;color:#F4F3EE;font-family:"Inter",system-ui,sans-serif}
main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;box-sizing:border-box}
.vf{position:absolute;inset:24px;pointer-events:none}
.vf i{position:absolute;width:30px;height:30px;border:0 solid #FACC15}
.vf i:nth-child(1){top:0;left:0;border-width:2px 0 0 2px}.vf i:nth-child(2){top:0;right:0;border-width:2px 2px 0 0}
.vf i:nth-child(3){bottom:0;left:0;border-width:0 0 2px 2px}.vf i:nth-child(4){bottom:0;right:0;border-width:0 2px 2px 0}
.code{font:700 .8rem "JetBrains Mono",monospace;letter-spacing:.2em;color:#FACC15;margin:0 0 18px}
h1{margin:0 0 16px;font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:1.1}
p{margin:0 0 32px;color:#A8A39A;max-width:40ch}
a{display:inline-flex;padding:13px 26px;border-radius:999px;background:#FACC15;color:#0A0A0A;font-weight:700;text-decoration:none;box-shadow:0 0 28px rgba(250,204,21,.4);transition:scale .35s cubic-bezier(.22,.61,.36,1)}
a:hover{scale:1.06}
</style>
</head>
<body>
<main>
  <div class="vf" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="code">ERRO 404 · CENA NÃO ENCONTRADA</p>
  <h1>Essa página saiu do enquadramento.</h1>
  <p>O endereço que você abriu não existe ou foi removido.</p>
  <a href="/">Voltar para o início</a>
</main>
</body>
</html>
